name: Deploy Les Brumes to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'index.html'
      - '.nojekyll'
      - 'brume.zip'
      - 'brume-pnj-16-vues.zip'
      - 'scripts/prepare-npcs.py'
      - 'scripts/version-pages.py'
      - 'tests/npc-presets.mjs'
      - 'tests/shadow-stability.mjs'
      - 'tests/block-visibility.mjs'
      - 'tests/liquid-flow.mjs'
      - 'tests/camera-collision.mjs'
      - 'tests/path-markers.mjs'
      - 'tests/**'
      - 'package-lock.json'
      - 'test-*.mjs'
      - 'test-support/**'
      - 'package.json'
      - 'recovery/import-release.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Verify and import source files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            test -f brume.zip
            python3 recovery/import-release.py brume.zip
            git add -- dist/
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Import verified astral release (164 static files)'
              git push origin HEAD:main
            fi
          fi
          test -s dist/index.html
          test -s dist/editor.mjs
          test -s dist/environment.mjs
          test -s dist/vendor/three.module.min.js
          test -d dist/assets/materials
          test -d dist/assets/kenney
          touch dist/.nojekyll
      - name: Prepare and verify built-in NPC appearances
        shell: bash
        run: |
          set -euo pipefail
          if [[ $(find dist/assets/npc -maxdepth 1 -name '*.webp' 2>/dev/null | wc -l) -ne 96 ]]; then
            python3 -m pip install --disable-pip-version-check Pillow==11.3.0
            python3 scripts/prepare-npcs.py
          fi
          for f in dist/*.mjs; do node --check "$f"; done
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          git add -- dist/assets/npc
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import and normalize 96 directional NPC sprites'
            git push origin HEAD:main
          fi
      - name: Check Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_pages)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != true ]]; then
            echo "::notice::Les sources sont importees. Activez GitHub Actions dans Settings > Pages, puis relancez ce workflow."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v6
      - name: Prepare consistent project URL
        if: steps.pages.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp index.html .nojekyll "$RUNNER_TEMP/pages-site/"
          cp -a dist "$RUNNER_TEMP/pages-site/dist"
          python3 scripts/version-pages.py "$RUNNER_TEMP/pages-site/dist" "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/pages-site/index.html"
          test -s "$RUNNER_TEMP/pages-site/dist/index.html"
      - name: Upload site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public entrypoint and game assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          fetch() {
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$1" -o "$2"
          }
          for attempt in $(seq 1 12); do
            query="?version=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-$attempt"
            echo "Public verification attempt $attempt/12"
            if ! fetch "$base/$query" root.html || ! grep -Fq 'dist/index.html' root.html; then
              echo "Root entrypoint missing or unexpected."
            elif ! fetch "$base/dist/index.html$query" game.html || ! grep -Fq 'id="app"' game.html; then
              echo "Game HTML missing or unexpected."
            elif ! grep -Fq "name=\"brume-revision\" content=\"$GITHUB_SHA\"" game.html ||
                 ! grep -Fq "src=\"bootstrap.mjs?v=$GITHUB_SHA\"" game.html ||
                 ! grep -Fq "./editor.mjs?v=$GITHUB_SHA" game.html; then
              echo "Revision mismatch. Expected $GITHUB_SHA; published:"
              grep -oE 'name="brume-revision" content="[^"]+"|src="bootstrap.mjs[^"]*"' game.html | head -5 || true
              echo "Check that Settings > Pages > Source is GitHub Actions if unversioned HTML persists."
            elif fetch "$base/dist/editor.mjs?v=$GITHUB_SHA" editor.mjs &&
                 fetch "$base/dist/assets/materials/grass.jpg$query" grass.jpg &&
                 fetch "$base/dist/assets/npc/guard-00.webp$query" guard.webp &&
                 python3 -c 'from pathlib import Path; assert Path("editor.mjs").stat().st_size>1000; assert Path("grass.jpg").read_bytes().startswith(bytes.fromhex("ffd8")); assert Path("guard.webp").read_bytes()[8:12]==b"WEBP"'; then
              echo "Public game revision, entry module and assets verified: $base/dist/index.html"
              exit 0
            else
              echo "One or more published assets are missing or invalid."
            fi
            sleep 5
          done
          echo "::error::Published site did not pass the revision and asset checks."
          exit 1
