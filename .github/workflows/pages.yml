name: Deploy Les Brumes to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'brume.zip'
      - 'recovery/import-release.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import source files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            test -f brume.zip
            python3 recovery/import-release.py brume.zip
            git add -- dist/
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Import verified astral release (164 static files)'
              git push origin HEAD:main
            fi
          fi
          test -s dist/index.html
          test -s dist/editor.mjs
          test -s dist/environment.mjs
          test -s dist/vendor/three.module.min.js
          test -d dist/assets/materials
          test -d dist/assets/kenney
          touch dist/.nojekyll
      - name: Check Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_pages)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != true ]]; then
            echo "::notice::Les sources sont importees. Activez GitHub Actions dans Settings > Pages, puis relancez ce workflow."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
