name: Deploy Les Brumes to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'index.html'
      - '.nojekyll'
      - 'brume.zip'
      - 'brume-pnj-16-vues.zip'
      - 'scripts/prepare-npcs.py'
      - 'tests/npc-presets.mjs'
      - 'tests/shadow-stability.mjs'
      - 'tests/block-visibility.mjs'
      - 'tests/liquid-flow.mjs'
      - 'tests/camera-collision.mjs'
      - 'tests/path-markers.mjs'
      - 'tests/**'
      - 'test-*.mjs'
      - 'test-support/**'
      - 'package.json'
      - 'recovery/import-release.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and import source files
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f dist/index.html ]]; then
            test -f brume.zip
            python3 recovery/import-release.py brume.zip
            git add -- dist/
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Import verified astral release (164 static files)'
              git push origin HEAD:main
            fi
          fi
          test -s dist/index.html
          test -s dist/editor.mjs
          test -s dist/environment.mjs
          test -s dist/vendor/three.module.min.js
          test -d dist/assets/materials
          test -d dist/assets/kenney
          touch dist/.nojekyll
      - name: Prepare and verify built-in NPC appearances
        shell: bash
        run: |
          set -euo pipefail
          if [[ $(find dist/assets/npc -maxdepth 1 -name '*.webp' 2>/dev/null | wc -l) -ne 96 ]]; then
            python3 -m pip install --disable-pip-version-check Pillow==11.3.0
            python3 scripts/prepare-npcs.py
          fi
          for f in dist/*.mjs; do node --check "$f"; done
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm test
          git add -- dist/assets/npc
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Import and normalize 96 directional NPC sprites'
            git push origin HEAD:main
          fi
      - name: Check Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          enabled=$(gh api "repos/$GITHUB_REPOSITORY" --jq .has_pages)
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != true ]]; then
            echo "::notice::Les sources sont importees. Activez GitHub Actions dans Settings > Pages, puis relancez ce workflow."
          fi
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Prepare consistent project URL
        if: steps.pages.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp index.html .nojekyll "$RUNNER_TEMP/pages-site/"
          cp -a dist "$RUNNER_TEMP/pages-site/dist"
          test -s "$RUNNER_TEMP/pages-site/index.html"
          test -s "$RUNNER_TEMP/pages-site/dist/index.html"
      - name: Upload site
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public entrypoint and game assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          query="?version=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$RUNNER_TEMP/smoke"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 15 "$base/$query" -o "$RUNNER_TEMP/smoke/root.html" &&
               grep -Fq 'dist/index.html' "$RUNNER_TEMP/smoke/root.html" &&
               curl -fsSL --max-time 15 "$base/dist/index.html$query" -o "$RUNNER_TEMP/smoke/game.html" &&
               grep -Fq 'id="app"' "$RUNNER_TEMP/smoke/game.html" &&
               grep -Fq 'src="editor.mjs"' "$RUNNER_TEMP/smoke/game.html" &&
               curl -fsSL --max-time 15 "$base/dist/editor.mjs$query" -o "$RUNNER_TEMP/smoke/editor.mjs" &&
               curl -fsSL --max-time 15 "$base/dist/assets/materials/grass.jpg$query" -o "$RUNNER_TEMP/smoke/grass.jpg" &&
               curl -fsSL --max-time 15 "$base/dist/assets/npc/guard-00.webp$query" -o "$RUNNER_TEMP/smoke/guard.webp" &&
               python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); assert (p/"editor.mjs").stat().st_size>1000; assert (p/"grass.jpg").read_bytes().startswith(bytes.fromhex("ffd8")); assert (p/"guard.webp").read_bytes()[8:12]==b"WEBP"' "$RUNNER_TEMP/smoke"; then
              echo "Public game HTML, entry module and grass texture verified: $base/dist/index.html"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Published site did not pass the HTTP checks."
          exit 1
